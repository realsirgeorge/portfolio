name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time placeholders only. Real secrets live on the server.
      ADMIN_PASSWORD: "ci_placeholder_password_12"
      SESSION_SECRET: "ci_placeholder_secret_at_least_32_characters_long"
      ADMIN_USER_ID: "ci-user"
      SESSION_DURATION: "86400"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            ADMIN_PASSWORD=ci_placeholder_password_12
            SESSION_SECRET=ci_placeholder_secret_at_least_32_characters_long
            ADMIN_USER_ID=ci-user
            SESSION_DURATION=86400
          cache-from: type=gha
          cache-to: type=gha,mode=max
